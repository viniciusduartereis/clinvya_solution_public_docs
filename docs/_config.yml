# Site
title: "Plataforma de Gestão Clínica com IA"
description: "SaaS para clínicas de saúde com IA integrada para prontuário digital, agendamento inteligente e controle financeiro clínico."
url: "https://docs.clinvya.com"
baseurl: ""

# Idioma e região
lang: pt-BR

# Autor (string simples)
author: "Vinicius Duarte Reis"

# SEO
tagline: "Menos burocracia. Mais tempo com o paciente."
keywords:
  - gestão clínica SaaS
  - IA em saúde
  - prontuário digital
  - agendamento médico
  - controle financeiro clínico
  - Clinvya

# GitHub Pages
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Tema Minima e links sociais
minima:
  skin: classic
  social_links:
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/viniciusduartereis/" }
    - { platform: github, user_url: "https://github.com/viniciusduartereis" }

# Navegação
header_pages:
  - index.md

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Excluir arquivos desnecessários do build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor